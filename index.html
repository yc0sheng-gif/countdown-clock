<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101a2b">
  <meta name="description" content="跨平台倒數計時器">
  <title>倒數計時器</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app" id="app">
    <section class="clock-shell" id="clockShell" aria-label="倒數時鐘">
      <header class="topbar">
        <div class="brand"><span class="brand-dot"></span>倒數計時器</div>
        <div class="top-actions">
          <button id="settingsBtn" class="icon-btn" title="聲音與畫面設定" aria-label="設定">⚙</button>
        </div>
      </header>
      <div id="clockFill" class="clock-fill" aria-hidden="true"></div>
      <div class="clock-center">
        <div id="timerDisplay" class="timer-display">--:--</div>
        <div id="statusText" class="status-text">選擇時間開始</div>
      </div>
      <section class="controls">
        <div class="main-controls">
          <button id="startPauseBtn" class="primary-btn">開始</button>
          <button id="restartBtn" class="control-btn" title="重來">↺</button>
          <button id="stopBtn" class="control-btn" title="結束">■</button>
        </div>
        <div class="bottom-actions">
          <div id="quickButtons" class="quick-buttons" aria-label="四組時間設定"></div>
          <button id="installBtn" class="text-btn hidden">安裝</button>
        </div>
      </section>
    </section>
  </main>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="settingsForm">
      <div class="dialog-heading"><h2>設定</h2><button class="close-btn" value="cancel" aria-label="關閉">×</button></div>
      <h3>滴答聲</h3>
      <label class="switch-line"><span>每秒滴答聲</span><input id="tickEnabled" type="checkbox" checked></label>
      <label class="range-line"><span>滴答聲音量 <b id="tickVolumeText">70%</b></span><input id="tickVolume" type="range" min="0" max="100" value="70"></label>
      <p class="hint">聲音會經過限制峰值處理，避免最大音量時削波。剩餘 30% 起逐漸加快，最後 10% 加快至每秒兩次。</p>
      <hr>
      <h3>時間到達提示音</h3>
      <label class="field">鈴聲種類<select id="alarmType"></select></label>
      <button type="button" id="testAlarmBtn" class="control-btn preview-alarm-btn">試聽提示音</button>
      <label class="range-line"><span>提示音音量 <b id="alarmVolumeText">75%</b></span><input id="alarmVolume" type="range" min="0" max="100" value="75"></label>
      <label class="field">播放方式<select id="alarmMode"><option value="once">播放一次</option><option value="long">延長播放</option><option value="repeat">重複播放 5 次</option></select></label>
      <hr>
      <h3>時鐘大小</h3>
      <label class="field">手機畫面佔用<select id="clockSize"><option value="0.6">60%</option><option value="0.7">70%</option><option value="0.8">80%</option><option value="0.9">90%</option><option value="fullscreen">全螢幕</option></select></label>
      <hr>
      <h3>時鐘底色</h3>
      <p class="hint">倒數時，亮色填充會隨剩餘時間逐漸縮小。</p>
      <div id="themeButtons" class="theme-buttons" aria-label="時鐘底色"></div>
      <label class="field">按鍵文字與符號顏色<select id="buttonTextColor">
        <option value="#111111">黑色</option><option value="#ffffff">白色</option>
        <option value="#d9dde3">淺灰</option><option value="#f0f1f3">淺淺灰</option>
        <option value="#ff6fae">粉紅</option><option value="#ffe45e">亮黃</option>
        <option value="#70d6ff">天空藍</option><option value="#7cffb2">薄荷綠</option>
      </select></label>
      <div class="dialog-actions"><button value="cancel" class="primary-btn">完成</button></div>
    </form>
  </dialog>

  <dialog id="timerDialog" class="dialog">
    <form method="dialog" class="dialog-card" id="timerForm">
      <div class="dialog-heading"><h2 id="timerDialogTitle">設定時間</h2><button class="close-btn" value="cancel" aria-label="關閉">×</button></div>
      <p class="hint">調整時、分、秒，只會更新這一組。</p>
      <div id="timerFields" class="timer-fields"></div>
      <div class="dialog-actions"><button value="cancel" class="control-btn">取消</button><button id="saveTimersBtn" value="default" class="primary-btn">儲存</button></div>
    </form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
